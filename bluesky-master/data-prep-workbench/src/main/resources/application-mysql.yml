spring:
  datasource:
    url: jdbc:mysql://${BS_MYSQL_HOST:127.0.0.1}:${BS_MYSQL_PORT:3306}/${BS_MYSQL_DATABASE:bluesky_data_prep}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
