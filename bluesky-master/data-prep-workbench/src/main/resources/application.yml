server:
  port: ${BS_PREP_PORT:8090}
  address: 127.0.0.1

spring:
  application:
    name: bluesky-data-prep-workbench
  datasource:
    url: jdbc:h2:file:${BS_PREP_DATA_DIR:./data}/prep;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: prep
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO

mybatis:
  configuration:
    map-underscore-to-camel-case: true
