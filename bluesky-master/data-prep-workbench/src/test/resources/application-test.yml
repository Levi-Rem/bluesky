spring:
  datasource:
    url: jdbc:h2:mem:dataprep;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: WARN
