spring:
  datasource:
    url: jdbc:h2:mem:training;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/performance-seed

bluesky:
  reference-data:
    enforcement-enabled: false
  data-prep:
    startup-load-enabled: false
  adapter:
    state-subscription-enabled: false
    health-poll-millis: 3600000

---
spring:
  config:
    activate:
      on-profile: '!performance-seed-test'
  flyway:
    locations: classpath:db/migration

logging:
  level:
    root: WARN
